name: Bug Report
description: Report a bug, unexpected behavior, or privacy concern in Rumah Kita
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Run 'npm start'
        2. Navigate to '...'
        3. Observe error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS & Node.js Version
      placeholder: "e.g., Windows 11 / Ubuntu 24.04, Node.js v22.x"
      description: "IMPORTANT: Do NOT paste any personal local paths (C:\\Users\\...) or API keys!"
    validations:
      required: true
